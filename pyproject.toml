[project]
name = "code-sammler"
version = "0.1.0"
description = "Code Collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.0.0",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Local decision model for CLASSIFIER=laya. Deliberately not a default
# dependency: it pulls a torch runtime and ~800 MB of weights.
laya = ["laya>=0.3.20"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "laya"
ignore_missing_imports = true
